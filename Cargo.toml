[package]
name = "churro"
version = "0.1.0-alpha3"
edition = "2024"
license = "Apache-2.0"
authors = ["jacklak-redstone (jacklak)"]
description = "A Rust crate to make Chatto bots."
documentation = "https://docs.rs/churro"
repository = "https://github.com/jacklak-redstone/churro"

[dependencies]
async-trait = "0.1.92"
buffa = { version = "0.9.2", features = ["json"] }
buffa-descriptor = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
bytes = "1.12.1"
connectrpc = { version = "0.9.1", features = ["client", "client-tls"] }
futures-util = "0.3.34"
http = "1.5.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
webpki-roots = "1.0.11"

[build-dependencies]
connectrpc-build = "0.9"
walkdir = "2.5.0"
